# Orchestrates the whole workflow: tests -> pipeline stages -> commit history/ -> deploy the dashboard.
# Each stage's outcome is recorded in history/pipeline_status.json and shown on the dashboard.
# Stages skip themselves, with a stated reason, until their secrets and inputs exist.
# Raw ACLED data and post text stay on the runner: never add them to artifacts or caches, because this repo is public.
name: pipeline
on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays. The X pull stays off unless the ENABLE_X_PULL variable is 'true'.
  workflow_dispatch:
    inputs:
      pull_x:
        description: Pull posts from X and issue a forecast (costs credits)
        type: boolean
        default: false
      extractor:
        description: rules, or a gemini-* or claude-* model id (costs credits)
        type: string
        default: rules
      rebuild:
        description: Re-run the backtest report on the newest ACLED data (the frozen baseline stays)
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  stages:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PULL_X: ${{ inputs.pull_x || vars.ENABLE_X_PULL == 'true' }}
      EXTRACTOR: ${{ inputs.extractor || vars.X_EXTRACTOR || 'rules' }}
      REBUILD: ${{ inputs.rebuild || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install LLM clients
        if: env.EXTRACTOR != 'rules'
        run: pip install -r requirements-llm.txt
      - name: Restore the VIEWS cache
        uses: actions/cache@v4
        with:
          path: data/views
          key: views-${{ github.run_id }}
          restore-keys: views-
      - name: Run all stages
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=(--extractor "$EXTRACTOR")
          [ "$PULL_X" = "true" ] && args+=(--pull-x)
          [ "$REBUILD" = "true" ] && args+=(--rebuild)
          python pipeline.py orchestrate "${args[@]}"
      - name: Commit post-free results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history config
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'Update published results'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

  dashboard:
    needs: stages
    if: ${{ !cancelled() && needs.stages.result != 'skipped' }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
