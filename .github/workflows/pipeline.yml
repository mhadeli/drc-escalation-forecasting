# Orchestrates the workflow after ingest: tests -> backtest, X check, forecast, score -> commit history/ -> dashboard.
# Ingest reads raw ACLED and X data, so it runs locally and pushes only the aggregates in history/inputs/.
# A push of new aggregates starts this workflow. Every stage records its outcome in history/pipeline_status.json.
# No secrets are needed, and nothing raw ever reaches the runner.
name: pipeline
on:
  push:
    branches: [main]
    paths:
      - history/inputs/**
      - pipeline.py
      - drc_watch/**
      - reports/prereg.md
      - requirements.txt
      - .github/workflows/pipeline.yml
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  stages:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Backtest, X check, forecast and score
        run: python pipeline.py orchestrate
      - name: Commit results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'Update published results'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

  dashboard:
    needs: stages
    if: ${{ !cancelled() && needs.stages.result != 'skipped' }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
